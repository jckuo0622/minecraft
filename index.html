<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Web - 完整物理與視覺版</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: "Microsoft JhengHei", sans-serif; }
        
        /* 1. 登錄介面樣式 */
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            background: linear-gradient(to bottom, #00b4ff 0%, #0072ff 30%, #00a859 100%);
            z-index: 100; text-align: center; color: white;
        }

        .title-area h1 { font-size: 70px; margin: 0; text-shadow: 4px 4px 0px #006699; }
        
        .play-button {
            margin: 30px 0; background: linear-gradient(to bottom, #00cc44, #008822);
            border: none; padding: 15px 40px; font-size: 28px; color: white;
            border-radius: 10px; cursor: pointer; box-shadow: 0px 6px 0px #005511;
            transition: transform 0.1s;
        }
        .play-button:active { transform: translateY(4px); box-shadow: 0px 2px 0px #005511; }

        .controls-card {
            background-color: rgba(0, 80, 120, 0.6); border-radius: 15px; padding: 20px;
            text-align: left; border: 1px solid rgba(255, 255, 255, 0.2); font-size: 18px;
        }

        /* 2. 遊戲中介面 */
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 16px; height: 16px;
            border: 2px solid white; transform: translate(-50%, -50%);
            z-index: 5; display: none; pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="crosshair"></div>

    <!-- 登錄介面 -->
    <div id="overlay">
        <div class="container">
            <div class="title-area">
                <h1>MINECRAFT</h1>
                <div style="font-size: 20px; margin-top: 5px;">網頁開發版</div>
            </div>
            <button class="play-button" id="btn-play">開始遊戲</button>
            <div class="controls-card">
                <div>🖱️ 點擊左鍵 - 破壞方塊</div>
                <div>🖱️ 點擊右鍵 - 放置方塊</div>
                <div>⌨️ W/A/S/D - 移動方向</div>
                <div>⌨️ 空白鍵 - 跳躍 (可跳上地面方塊)</div>
                <div>⌨️ ESC - 暫停 / 回到選單</div>
            </div>
        </div>
    </div>

    <!-- 遊戲容器 -->
    <div id="game-container"></div>

    <script type="module">
        import * as THREE from 'https://cdn.skypack.dev/three@0.136.0';
        import { PointerLockControls } from 'https://cdn.skypack.dev/three@0.136.0/examples/jsm/controls/PointerLockControls.js';

        // --- A. 視覺升級：生成像素貼圖 ---
        function createPixelTexture(color1, color2) {
            const canvas = document.createElement('canvas');
            canvas.width = 16; canvas.height = 16;
            const context = canvas.getContext('2d');
            for (let x = 0; x < 16; x++) {
                for (let y = 0; y < 16; y++) {
                    context.fillStyle = Math.random() > 0.5 ? color1 : color2;
                    context.fillRect(x, y, 1, 1);
                }
            }
            const texture = new THREE.CanvasTexture(canvas);
            texture.magFilter = THREE.NearestFilter; // 保持像素銳利
            return texture;
        }

        const grassTopTex = createPixelTexture('#5dad44', '#77bc43');
        const dirtTex = createPixelTexture('#8b5a2b', '#7a4e25');

        const grassMaterials = [
            new THREE.MeshLambertMaterial({ map: dirtTex }), // 右
            new THREE.MeshLambertMaterial({ map: dirtTex }), // 左
            new THREE.MeshLambertMaterial({ map: grassTopTex }), // 上
            new THREE.MeshLambertMaterial({ map: dirtTex }), // 下
            new THREE.MeshLambertMaterial({ map: dirtTex }), // 前
            new THREE.MeshLambertMaterial({ map: dirtTex }), // 後
        ];

        // --- B. 初始化 3D 場景 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('game-container').appendChild(renderer.domElement);

        // 燈光
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        const sunLight = new THREE.DirectionalLight(0xffffff, 0.4);
        sunLight.position.set(5, 15, 5);
        scene.add(sunLight);

        // 控制器
        const controls = new PointerLockControls(camera, document.body);
        const btnPlay = document.getElementById('btn-play');
        const overlay = document.getElementById('overlay');
        const crosshair = document.getElementById('crosshair');

        btnPlay.addEventListener('click', () => controls.lock());
        controls.addEventListener('lock', () => { overlay.style.display = 'none'; crosshair.style.display = 'block'; });
        controls.addEventListener('unlock', () => { overlay.style.display = 'flex'; crosshair.style.display = 'none'; });

        // --- C. 世界生成 ---
        const boxGeo = new THREE.BoxGeometry(1, 1, 1);
        const blocks = [];
        for(let x = -12; x < 12; x++) {
            for(let z = -12; z < 12; z++) {
                const mesh = new THREE.Mesh(boxGeo, grassMaterials);
                mesh.position.set(x, 0, z);
                scene.add(mesh);
                blocks.push(mesh);
            }
        }
        camera.position.set(0, 2, 5);

        // --- D. 物理與移動設定 ---
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let canJump = false;
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        const groundRaycaster = new THREE.Raycaster(); // 向下偵測地面的射線

        document.addEventListener('keydown', (e) => {
            switch (e.code) {
                case 'KeyW': moveForward = true; break;
                case 'KeyS': moveBackward = true; break;
                case 'KeyA': moveLeft = true; break;
                case 'KeyD': moveRight = true; break;
                case 'Space': if (canJump) velocity.y += 12; canJump = false; break;
            }
        });
        document.addEventListener('keyup', (e) => {
            switch (e.code) {
                case 'KeyW': moveForward = false; break;
                case 'KeyS': moveBackward = false; break;
                case 'KeyA': moveLeft = false; break;
                case 'KeyD': moveRight = false; break;
            }
        });

        // 放置與破壞
        window.addEventListener('mousedown', (e) => {
            if (!controls.isLocked) return;
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
            const intersects = raycaster.intersectObjects(blocks);
            if (intersects.length > 0) {
                const intersect = intersects[0];
                if (e.button === 0) { // 左鍵：破壞
                    scene.remove(intersect.object);
                    blocks.splice(blocks.indexOf(intersect.object), 1);
                } else if (e.button === 2) { // 右鍵：放置
                    const newBlock = new THREE.Mesh(boxGeo, grassMaterials);
                    newBlock.position.copy(intersect.object.position).add(intersect.face.normal);
                    scene.add(newBlock);
                    blocks.push(newBlock);
                }
            }
        });

        // --- E. 遊戲迴圈 (Game Loop) ---
        let prevTime = performance.now();
        function animate() {
            requestAnimationFrame(animate);
            if (controls.isLocked) {
                const time = performance.now();
                const delta = (time - prevTime) / 1000;

                // 1. 處理水平移動阻力
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;

                // 2. 處理重力
                velocity.y -= 9.8 * 3.5 * delta; // 重力加速度

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                if (moveForward || moveBackward) velocity.z -= direction.z * 100.0 * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * 100.0 * delta;

                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);

                // 3. 核心：地面碰撞偵測
                groundRaycaster.set(camera.position, new THREE.Vector3(0, -1, 0));
                const groundIntersects = groundRaycaster.intersectObjects(blocks);
                
                let onObject = false;
                if (groundIntersects.length > 0) {
                    const dist = groundIntersects[0].distance;
                    if (dist <= 1.8) { // 玩家視線高度到腳底的距離
                        onObject = true;
                    }
                }

                if (onObject === true) {
                    velocity.y = Math.max(0, velocity.y); // 踩到東西就停止下落
                    canJump = true;
                }

                // 4. 更新垂直位置
                camera.position.y += (velocity.y * delta);

                // 世界底部保底 (防止掉進虛空)
                if (camera.position.y < 1.8) {
                    velocity.y = 0;
                    camera.position.y = 1.8;
                    canJump = true;
                }

                prevTime = time;
            }
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
