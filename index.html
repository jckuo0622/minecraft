<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Web - 完整碰撞修正版</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: "Microsoft JhengHei", sans-serif; }
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            background: linear-gradient(to bottom, #00b4ff, #00a859);
            z-index: 100; text-align: center; color: white;
        }
        .play-button {
            margin: 20px 0; background: #00aa44; border: none; padding: 15px 40px; 
            font-size: 28px; color: white; border-radius: 10px; cursor: pointer;
            box-shadow: 0px 6px 0px #005511;
        }
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 16px; height: 16px;
            border: 2px solid white; transform: translate(-50%, -50%);
            z-index: 5; display: none; pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="crosshair"></div>
    <div id="overlay">
        <div>
            <h1 style="font-size: 60px; text-shadow: 4px 4px #006699;">MINECRAFT</h1>
            <p>已修正：方塊側面穿透、掉落判定</p>
            <button class="play-button" id="btn-play">開始遊戲</button>
            <div style="background: rgba(0,0,0,0.3); padding: 20px; border-radius: 10px; text-align: left;">
                <li><b>W/A/S/D</b>：移動 (現在會被牆擋住)</li>
                <li><b>空白鍵</b>：跳躍</li>
                <li><b>左鍵/右鍵</b>：破壞與建造</li>
            </div>
        </div>
    </div>

    <div id="game-container"></div>

    <script type="module">
        import * as THREE from 'https://cdn.skypack.dev/three@0.136.0';
        import { PointerLockControls } from 'https://cdn.skypack.dev/three@0.136.0/examples/jsm/controls/PointerLockControls.js';

        // --- 1. 視覺貼圖生成 ---
        function createPixelTexture(c1, c2) {
            const canvas = document.createElement('canvas');
            canvas.width = 16; canvas.height = 16;
            const ctx = canvas.getContext('2d');
            for(let x=0; x<16; x++) for(let y=0; y<16; y++) {
                ctx.fillStyle = Math.random() > 0.5 ? c1 : c2;
                ctx.fillRect(x,y,1,1);
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.magFilter = THREE.NearestFilter;
            return tex;
        }

        const grassTop = createPixelTexture('#5dad44', '#77bc43');
        const dirtSide = createPixelTexture('#8b5a2b', '#7a4e25');
        const grassMaterials = [
            new THREE.MeshLambertMaterial({map: dirtSide}), new THREE.MeshLambertMaterial({map: dirtSide}),
            new THREE.MeshLambertMaterial({map: grassTop}), new THREE.MeshLambertMaterial({map: dirtSide}),
            new THREE.MeshLambertMaterial({map: dirtSide}), new THREE.MeshLambertMaterial({map: dirtSide})
        ];

        // --- 2. 場景初始化 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('game-container').appendChild(renderer.domElement);

        const controls = new PointerLockControls(camera, document.body);
        const overlay = document.getElementById('overlay');
        document.getElementById('btn-play').addEventListener('click', () => controls.lock());
        controls.addEventListener('lock', () => { overlay.style.display = 'none'; document.getElementById('crosshair').style.display = 'block'; });
        controls.addEventListener('unlock', () => { overlay.style.display = 'flex'; document.getElementById('crosshair').style.display = 'none'; });

        // --- 3. 世界生成 ---
        const boxGeo = new THREE.BoxGeometry(1,1,1);
        const blocks = [];
        for(let x=-10; x<10; x++) for(let z=-10; z<10; z++) {
            const m = new THREE.Mesh(boxGeo, grassMaterials);
            m.position.set(x, 0, z);
            scene.add(m);
            blocks.push(m);
        }
        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        camera.position.set(0, 2, 5);

        // --- 4. 物理移動與碰撞偵測變數 ---
        let moveF = false, moveB = false, moveL = false, moveR = false, canJump = false;
        const vel = new THREE.Vector3();
        const dir = new THREE.Vector3();
        const ray = new THREE.Raycaster(); // 用於水平碰撞與互動
        const groundRay = new THREE.Raycaster(); // 專門偵測腳底

        document.addEventListener('keydown', (e) => {
            if(e.code==='KeyW') moveF=true; if(e.code==='KeyS') moveB=true;
            if(e.code==='KeyA') moveL=true; if(e.code==='KeyD') moveR=true;
            if(e.code==='Space' && canJump) { vel.y += 12; canJump = false; }
        });
        document.addEventListener('keyup', (e) => {
            if(e.code==='KeyW') moveF=false; if(e.code==='KeyS') moveB=false;
            if(e.code==='KeyA') moveL=false; if(e.code==='KeyD') moveR=false;
        });

        // 破壞與建造
        window.addEventListener('mousedown', (e) => {
            if (!controls.isLocked) return;
            ray.setFromCamera(new THREE.Vector2(0,0), camera);
            const inter = ray.intersectObjects(blocks);
            if (inter.length > 0) {
                if (e.button === 0) {
                    scene.remove(inter[0].object);
                    blocks.splice(blocks.indexOf(inter[0].object), 1);
                } else if (e.button === 2) {
                    const b = new THREE.Mesh(boxGeo, grassMaterials);
                    b.position.copy(inter[0].object.position).add(inter[0].face.normal);
                    scene.add(b);
                    blocks.push(b);
                }
            }
        });

        // --- 5. 核心邏輯：碰撞檢測函式 ---
        function checkCollision(directionVector) {
            // 從相機位置（稍微降低一點，到胸口位置）發射射線
            const rayPos = camera.position.clone();
            rayPos.y -= 0.5; 
            ray.set(rayPos, directionVector);
            const hits = ray.intersectObjects(blocks);
            // 如果前方 0.5 單位內有東西，就回傳「碰撞」
            return hits.length > 0 && hits[0].distance < 0.5;
        }

        // --- 6. 遊戲迴圈 ---
        let prevT = performance.now();
        function animate() {
            requestAnimationFrame(animate);
            if (controls.isLocked) {
                const t = performance.now();
                const dt = (t - prevT) / 1000;

                // 物理阻力與重力
                vel.x -= vel.x * 10 * dt;
                vel.z -= vel.z * 10 * dt;
                vel.y -= 9.8 * 4.0 * dt; 

                // 計算移動方向
                dir.z = Number(moveF) - Number(moveB);
                dir.x = Number(moveR) - Number(moveL);
                dir.normalize();

                // 水平移動與「牆壁」碰撞檢查
                const worldDir = new THREE.Vector3();
                camera.getWorldDirection(worldDir);
                worldDir.y = 0; worldDir.normalize(); // 取得水平朝向

                if (moveF || moveB) {
                    const fwd = worldDir.clone().multiplyScalar(dir.z);
                    if (!checkCollision(fwd)) vel.z -= dir.z * 100 * dt;
                }
                if (moveL || moveR) {
                    const side = new THREE.Vector3().crossVectors(camera.up, worldDir).multiplyScalar(dir.x);
                    if (!checkCollision(side.negate())) vel.x -= dir.x * 100 * dt;
                }

                controls.moveRight(-vel.x * dt);
                controls.moveForward(-vel.z * dt);

                // 地面碰撞檢查
                groundRay.set(camera.position, new THREE.Vector3(0, -1, 0));
                const gHits = groundRay.intersectObjects(blocks);
                let onObj = false;
                if (gHits.length > 0 && gHits[0].distance <= 1.8) onObj = true;

                if (onObj) {
                    vel.y = Math.max(0, vel.y);
                    canJump = true;
                }
                camera.position.y += (vel.y * dt);

                // 保底高度
                if (camera.position.y < 1.8) { vel.y = 0; camera.position.y = 1.8; canJump = true; }
                prevT = t;
            }
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth/window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
