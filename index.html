<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Minecraft Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container"></div>
    <div id="crosshair">+</div>
    
    <div id="overlay">
        <div id="menu">
            <h1>我的世界網頁版</h1>
            <button id="btn-play">開始遊戲</button>
            <p>控制：W A S D 移動 | Space 跳躍 | Shift 潛行<br>
               1~3 切換方塊 | 左鍵挖掘 | 右鍵建造</p>
        </div>
    </div>

    <div id="inventory-panel" style="display:none; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); min-width:420px; background:rgba(0,0,0,0.85); color:#fff; border:2px solid #888; padding:16px; z-index:1000; font-family:monospace;">
        <h3 style="margin:0 0 10px 0;">背包（E 開關）</h3>
        <div id="inventory-list" style="margin-bottom:14px;"></div>
        <h4 style="margin:0 0 8px 0;">Crafting</h4>
        <div id="crafting-list"></div>
        <div id="crafting-message" style="margin-top:10px; color:#ffd37f;"></div>
    </div>

    <script type="module" src="game.js"></script>
</body>
</html>
